  <text x="566" y="510" fill="#0369a1" font-size="11">• Kuota 3–8 siswa, Deteksi 3x Absen Berturut, Honor Tutor Rp75.000/90m</text>
  <text x="566" y="527" fill="#0369a1" font-size="11">• Pemetaan email -&gt; role (DESIGNATED_ACTOR_PROFILES) &amp; error auth ID</text>

  <rect x="1046" y="452" width="310" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1062" y="474" fill="#0f172a" font-size="13" font-weight="700">ReceiptModal.tsx &amp; pdfReport.ts</text>
  <text x="1062" y="493" fill="#475569" font-size="11">• Kuitansi Pembayaran Resmi (KW-BC-...)</text>
  <text x="1062" y="510" fill="#475569" font-size="11">• Laporan Keuangan Pemilik (jsPDF + CSV)</text>
  <text x="1062" y="527" fill="#475569" font-size="11">• ToastContainer.tsx (Notifikasi UI)</text>

