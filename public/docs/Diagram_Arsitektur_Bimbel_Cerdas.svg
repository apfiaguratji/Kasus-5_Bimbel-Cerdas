  <text x="60" y="474" fill="#0c4a6e" font-size="13" font-weight="700">AppDataContext.tsx (State &amp; Sync Layer)</text>
  <text x="60" y="493" fill="#0369a1" font-size="11">• Listener onAuthStateChanged &amp; Gate emailVerified == true</text>
  <text x="60" y="510" fill="#0369a1" font-size="11">• Role-Scoped Firestore Queries &amp; Auto-Sync peran email QA</text>
  <text x="60" y="527" fill="#0369a1" font-size="11">• Transaksi atomik writeBatch (daftar siswa, bayar SPP, promosi waitlist)</text>

  <rect x="550" y="452" width="480" height="90" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2"/>
