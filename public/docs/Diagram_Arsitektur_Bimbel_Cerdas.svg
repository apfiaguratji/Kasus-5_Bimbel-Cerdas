  <text x="60" y="366" fill="#334155" font-size="11">• Beranda &amp; Profil Lembaga</text>
  <text x="60" y="383" fill="#334155" font-size="11">• Katalog Program SD/SMP/SMA/UTBK</text>
  <text x="60" y="400" fill="#334155" font-size="11">• Jadwal &amp; Sisa Kuota Kelas</text>
