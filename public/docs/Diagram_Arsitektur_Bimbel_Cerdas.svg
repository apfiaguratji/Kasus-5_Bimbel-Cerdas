  <!-- ==================== 3. BACKEND REST API LAYER ==================== -->
  <rect x="24" y="588" width="1352" height="148" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="24" y="588" width="1352" height="32" rx="14" fill="#fef3c7"/>
  <rect x="24" y="606" width="1352" height="14" fill="#fef3c7"/>
  <text x="44" y="609" fill="#92400e" font-size="13" font-weight="700" letter-spacing="0.5">3. BACKEND REST API LAYER (Express 4 + Vercel Serverless — api/[...route].ts &amp; server/apiRouter.ts)</text>

  <!-- Public Endpoints -->
  <rect x="44" y="634" width="640" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="60" y="655" fill="#78350f" font-size="13" font-weight="700">Endpoint Publik (/api/*)</text>
  <text x="60" y="674" fill="#92400e" font-size="11">• GET /api/health &amp; GET /api/docs — Status server, Project ID, &amp; spesifikasi endpoint</text>
  <text x="60" y="691" fill="#92400e" font-size="11">• GET /api/programs, /api/classes, /api/schedules — Katalog dari Firestore REST (fallback seed)</text>
  <text x="60" y="708" fill="#92400e" font-size="11">• POST /api/simulasi-biaya &amp; POST /api/honor-rekap — Berbagi logika businessRules.ts</text>

  <!-- Protected Endpoints -->
  <rect x="702" y="634" width="654" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="718" y="655" fill="#78350f" font-size="13" font-weight="700">Endpoint Terproteksi &amp; Proxy Firestore REST API</text>
  <text x="718" y="674" fill="#92400e" font-size="11">• GET /api/collections/:name (14 koleksi terproteksi: students, invoices, payments, dll.)</text>
  <text x="718" y="691" fill="#92400e" font-size="11">• Wajib header Authorization: Bearer &lt;Firebase_ID_Token&gt; (HTTP 401 jika tidak ada)</text>
  <text x="718" y="708" fill="#92400e" font-size="11">• Meneruskan Bearer Token ke firestore.googleapis.com agar tetap divalidasi firestore.rules</text>

  <!-- ==================== 4. DATABASE & SECURITY LAYER ==================== -->
  <rect x="24" y="768" width="1352" height="268" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="1.6"/>
  <rect x="24" y="768" width="1352" height="32" rx="14" fill="#d1fae5"/>
  <rect x="24" y="786" width="1352" height="14" fill="#d1fae5"/>
  <text x="44" y="789" fill="#065f46" font-size="13" font-weight="700" letter-spacing="0.5">4. DATABASE, AUTHENTICATION &amp; SECURITY LAYER (Firebase BaaS)</text>

  <!-- Firebase Auth -->
  <rect x="44" y="814" width="320" height="204" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="60" y="838" fill="#064e3b" font-size="13" font-weight="700">Firebase Authentication</text>
  <text x="60" y="860" fill="#065f46" font-size="11">Provider Aktif:</text>
  <text x="60" y="878" fill="#047857" font-size="11">• Email &amp; Password</text>
  <text x="60" y="895" fill="#047857" font-size="11">• Google Sign-In (OAuth 2.0)</text>
  <text x="60" y="920" fill="#065f46" font-size="11">Kontrol Akses:</text>
  <text x="60" y="938" fill="#047857" font-size="11">• Menerbitkan JWT ID Token</text>
  <text x="60" y="955" fill="#047857" font-size="11">• Wajib email_verified == true</text>
  <text x="60" y="972" fill="#047857" font-size="11">• Reset Sandi &amp; Kirim Ulang</text>
  <text x="60" y="989" fill="#047857" font-size="11">  Tautan Verifikasi</text>

  <!-- Firestore Security Rules -->
  <rect x="382" y="814" width="376" height="204" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="398" y="838" fill="#064e3b" font-size="13" font-weight="700">Firestore Security Rules (firestore.rules)</text>
  <text x="398" y="860" fill="#047857" font-size="11">• Default Deny (match /{document=**} -&gt; false)</text>
  <text x="398" y="878" fill="#047857" font-size="11">• Wajib isVerifiedUser() pada seluruh data privat</text>
  <text x="398" y="896" fill="#047857" font-size="11">• Single-Role RBAC Helpers:</text>
  <text x="410" y="914" fill="#065f46" font-size="10.5">isAdmin(), isPemilik(), isTutor(), isOwner(uid)</text>
  <text x="398" y="934" fill="#047857" font-size="11">• isDesignatedSelfRoleSync(uid):</text>
  <text x="410" y="952" fill="#065f46" font-size="10.5">Sinkronisasi peran otomatis email QA terdaftar</text>
  <text x="398" y="972" fill="#047857" font-size="11">• Validasi Skema Ketat (18 blueprint tipe &amp; field)</text>
  <text x="398" y="990" fill="#047857" font-size="11">• Isolasi PII (/users/{uid} hanya owner &amp; admin)</text>

  <!-- Cloud Firestore Collections -->
  <rect x="776" y="814" width="580" height="204" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
  <text x="792" y="836" fill="#064e3b" font-size="13" font-weight="700">Cloud Firestore (DB: ai-studio-c15e7da5-4f88-4940-89f4-ab28fa592704)</text>

  <rect x="792" y="848" width="268" height="74" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="804" y="866" fill="#065f46" font-size="11.5" font-weight="700">Master &amp; Katalog (4 Koleksi)</text>
  <text x="804" y="884" fill="#334155" font-size="10.5">programs • classes • schedules</text>
  <text x="804" y="901" fill="#334155" font-size="10.5">tutors</text>

  <rect x="1072" y="848" width="268" height="74" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1084" y="866" fill="#065f46" font-size="11.5" font-weight="700">Akun &amp; Konfigurasi (3 Koleksi)</text>
  <text x="1084" y="884" fill="#334155" font-size="10.5">users • admins • feature_flags</text>
  <text x="1084" y="901" fill="#64748b" font-size="10">(RBAC + 3 beta flags Admin)</text>

  <rect x="792" y="928" width="268" height="82" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="804" y="947" fill="#065f46" font-size="11.5" font-weight="700">Akademik &amp; Presensi (7 Koleksi)</text>
  <text x="804" y="965" fill="#334155" font-size="10.5">students • registrations • waitlists</text>
  <text x="804" y="981" fill="#334155" font-size="10.5">student_attendance • tutor_attendance</text>
  <text x="804" y="997" fill="#334155" font-size="10.5">followups • notifications</text>

  <rect x="1072" y="928" width="268" height="82" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1084" y="947" fill="#065f46" font-size="11.5" font-weight="700">Keuangan &amp; Keringanan (4 Koleksi)</text>
  <text x="1084" y="965" fill="#334155" font-size="10.5">invoices • payments • receipts</text>
  <text x="1084" y="981" fill="#334155" font-size="10.5">relief_requests</text>

